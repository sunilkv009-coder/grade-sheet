<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grade Contact Sheet</title>
<style>
  :root { --bg:#0e1014; --panel:#161920; --panel2:#1d212a; --line:#272c38; --text:#e7e9ef; --mute:#8a92a6;
          --accent:#ff8a3d; --ref:#35d08a; --r:#ff6b6b; --g:#5fd38d; --b:#6aa8ff; --shape:#4fd6ff; --warn:#ffcc66; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--text); font:13px/1.4 "Inter","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
         display:flex; flex-direction:column; user-select:none; overflow:hidden; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font-size:14px; font-weight:600; margin:0; letter-spacing:.2px; }
  header .dot { width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--accent); }
  #openname { color:var(--accent); margin-left:10px; }
  .su.cur { border-color:var(--accent); } .su button.primary { padding:0 12px; }
  #wimg { transition:opacity .15s; }
  #banner { position:absolute; left:12px; right:362px; top:8px; z-index:20; display:none; gap:10px; align-items:flex-start;
            background:#3a2a12; border:1px solid var(--warn); color:#ffd9a0; border-radius:10px; padding:10px 12px; font-size:13px; }
  #banner.on { display:flex; } #banner span { flex:1; white-space:pre-wrap; } #banner button { padding:2px 9px; }
  #status { color:var(--mute); font-size:12px; padding:3px 10px; border-radius:99px; background:var(--panel2); min-height:22px; }
  .grow { flex:1; }
  button, select, input[type=text] { font:inherit; color:var(--text); background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:7px 10px; }
  button { cursor:pointer; transition:background .12s, border-color .12s; white-space:nowrap; }
  button:hover { background:#252a36; border-color:#3a4152; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#1a1206; font-weight:600; }
  button.primary:hover { filter:brightness(1.08); }
  button.on { border-color:var(--accent); color:var(--accent); background:rgba(255,138,61,.1); }
  button:disabled { opacity:.45; cursor:default; }
  input[type=text]:focus, select:focus { outline:none; border-color:var(--accent); }
  input[type=checkbox] { accent-color:var(--accent); }
  main { flex:1; display:flex; min-height:0; }
  #grid { flex:1; display:grid; gap:12px; padding:14px; align-content:start; overflow:auto; }
  .tile { background:var(--panel); border:2px solid var(--line); border-radius:12px; overflow:hidden; cursor:pointer; }
  .tile.sel { border-color:var(--accent); }
  .tile.ref:not(.sel) { border-color:var(--ref); }
  .cv { position:relative; aspect-ratio:16/9; background:#000; touch-action:none; overflow:hidden; }
  .zw { position:absolute; inset:0; transform-origin:50% 50%; }                 /* zoomed and panned part: image, shapes, patch */
  .tools { position:absolute; top:8px; right:8px; display:flex; gap:6px; z-index:4; }
  .tools button { padding:2px 9px; font-size:11px; background:#000b; border-color:#fff3; }
  .fit { display:none; }
  .full { opacity:0; transition:opacity .15s; } .tile:hover .full, #grid.solo .full { opacity:1; }
  /* motion: short and light */
  .tile { transition:border-color .15s, box-shadow .15s; } .tile.sel { view-transition-name:seltile; }
  ::view-transition-group(*) { animation-duration:.22s; } ::view-transition-old(root), ::view-transition-new(root) { animation-duration:.18s; }
  @keyframes pop { from { opacity:0; transform:translateY(8px) scale(.98); } } @keyframes fade { from { opacity:0; } }
  #wiz.open { animation:fade .15s ease-out; } #wiz.open .card { animation:pop .18s ease-out; }
  .wmenu.open, #lvmenu.open { animation:pop .12s ease-out; }
  input[type=range]::-webkit-slider-thumb { transition:transform .1s; } input[type=range]:hover::-webkit-slider-thumb { transform:scale(1.15); }
  /* "preparing" overlay while Unreal captures */
  main { position:relative; }
  #busy { position:absolute; left:0; top:0; bottom:0; right:350px; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px;
          background:rgba(14,16,20,.82); backdrop-filter:blur(6px); z-index:20; }
  #busy.on { display:flex; animation:fade .2s ease-out; }
  #busy svg { width:320px; height:110px; overflow:visible; }

  #busy .wheel { animation:spin .35s linear infinite; transform-box:fill-box; transform-origin:center; } @keyframes spin { to { transform:rotate(360deg); } }
  #busy .road { stroke-dasharray:14 12; animation:road .3s linear infinite; } @keyframes road { to { stroke-dashoffset:-26; } }
  #busy .smoke circle { transform-box:fill-box; transform-origin:center; opacity:0; animation:puff .9s ease-out infinite; }
  #busy .smoke circle:nth-child(2) { animation-delay:.3s; } #busy .smoke circle:nth-child(3) { animation-delay:.6s; }
  @keyframes puff { 0% { opacity:.6; transform:translate(0, 0) scale(.5); } 100% { opacity:0; transform:translate(-52px, -12px) scale(2.4); } }
  #busytxt { font-size:14px; font-weight:600; } #busysub { color:var(--mute); font-size:12px; }
  #busystop { margin-top:6px; display:none; } #busy.cap #busystop { display:inline-block; }
  #busybar { width:260px; height:4px; border-radius:2px; background:#2c3240; overflow:hidden; } #busybar i { display:block; height:100%; width:0; background:var(--accent); transition:width .4s ease-out; }
  #grid.solo { grid-template-columns:1fr !important; }
  #grid.solo .tile { width:100%; max-width:calc((100vh - 150px) * 16 / 9); margin:0 auto; }
  .cv.draw { cursor:crosshair; }
  .cv canvas { width:100%; height:100%; display:block; }
  .cv svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
  .cv svg path { fill:none; stroke:var(--shape); stroke-width:1.5; vector-effect:non-scaling-stroke; opacity:.75; }
  .cv svg path.sel { stroke:#fff; opacity:1; stroke-dasharray:5 3; }
  .cv svg line { stroke:#fff; stroke-width:1; vector-effect:non-scaling-stroke; opacity:.7; }
  .cv svg circle { fill:#fff; stroke:#000; stroke-width:1; vector-effect:non-scaling-stroke; }
  .cv svg circle.h { fill:var(--shape); }
  .cv .empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--mute); }
  .patch { position:absolute; width:14px; height:14px; margin:-7px 0 0 -7px; border:1.5px solid #fff; border-radius:3px;
           box-shadow:0 0 0 1px #000; pointer-events:none; }
  .wipe { position:absolute; top:0; bottom:0; width:22px; margin-left:-11px; cursor:ew-resize; display:none; z-index:3; touch-action:none; }
  .wipe::before { content:""; position:absolute; left:10px; top:0; bottom:0; width:2px; background:#fff; box-shadow:0 0 0 1px #0006; }
  .wipe i { position:absolute; left:1px; top:50%; width:20px; height:20px; margin-top:-10px; border-radius:50%; background:#fff; box-shadow:0 1px 4px #000a; }
  .wipe span { position:absolute; bottom:8px; font-size:10px; font-weight:700; padding:2px 7px; border-radius:99px; background:#000a; color:#fff; white-space:nowrap; }
  .wipe .wl { right:18px; } .wipe .wr { left:18px; }
  .badge { position:absolute; top:8px; left:8px; background:var(--ref); color:#04130c; font-weight:700; font-size:10px;
           padding:2px 7px; border-radius:99px; display:none; }
  .tile.ref .badge { display:block; }
  .meta { display:flex; align-items:center; gap:6px; padding:8px 12px; font-size:12px; flex-wrap:wrap; }
  .meta b { font-weight:600; margin-right:2px; }
  .chip { background:var(--panel2); border:1px solid var(--line); border-radius:99px; padding:1px 8px; color:var(--mute); font-size:11px; }
  .meta .chip { cursor:pointer; } .meta .chip.on { border-color:var(--accent); color:var(--accent); background:rgba(255,138,61,.1); }
  .sw { width:14px; height:14px; border-radius:4px; border:1px solid #0008; }
  .num { font-family:ui-monospace,Consolas,monospace; color:var(--mute); font-size:11px; }
  .diff.bad { color:#ffb37a; } .diff.ok { color:var(--ref); }
  aside { width:350px; border-left:1px solid var(--line); background:var(--panel); overflow-y:auto; }
  .sec { padding:12px 16px; border-bottom:1px solid var(--line); }
  .sec h2 { margin:0 0 2px; font-size:15px; font-weight:600; }
  .sec .sub { color:var(--mute); font-size:12px; }
  .lbl { color:var(--mute); font-size:11px; text-transform:uppercase; letter-spacing:.6px; margin:0 0 8px; }
  .lbl.sp { margin-top:14px; }
  .btns { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .btns.three { grid-template-columns:1fr 1fr 1fr; }
  .btns .wide { grid-column:1/-1; }
  .tabs { display:flex; background:var(--panel2); border-radius:9px; padding:3px; gap:3px; }
  .tabs button { flex:1; border:0; background:transparent; padding:6px 2px; border-radius:7px; color:var(--mute); }
  .tabs button.on { background:var(--accent); color:#1a1206; font-weight:600; }
  .dd { position:relative; margin-top:8px; }
  .dd > button { width:100%; text-align:left; display:flex; gap:8px; }
  .dd > button span { flex:1; overflow:hidden; text-overflow:ellipsis; }
  #lvmenu { display:none; position:absolute; left:0; right:0; top:calc(100% + 4px); background:var(--panel2); border:1px solid #3a4152;
            border-radius:10px; padding:6px; z-index:10; box-shadow:0 8px 24px #000a; max-height:240px; overflow:auto; }
  #lvmenu.open { display:block; }
  label.ck { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px; cursor:pointer; }
  label.ck:hover { background:#252a36; }
  label.ck small { color:var(--mute); margin-left:auto; }
  label.ck small.warn { color:var(--warn); }
  #parts { display:flex; flex-wrap:wrap; gap:5px; margin:8px 0; max-height:92px; overflow:auto; }
  #parts .chip { cursor:pointer; color:var(--text); }
  #parts .cnt { width:100%; color:var(--mute); font-size:11px; }
  #lvmenu button.wide { width:100%; margin-top:6px; }
  #parts .chip.on { background:rgba(255,80,200,.18); border-color:#ff50c8; color:#ffb3ea; }
  .shape { display:flex; align-items:center; gap:8px; padding:5px 8px; border:1px solid var(--line); border-radius:8px; margin-top:6px; cursor:pointer; }
  .shape.sel { border-color:var(--shape); background:rgba(79,214,255,.08); }
  .shape .nm { width:58px; } .shape input { flex:1; --c:var(--shape); } .shape .num { width:38px; text-align:right; }
  .shape button { padding:0 7px; height:22px; }
  .hint { color:var(--mute); font-size:11px; margin-top:8px; }
  #sliders { padding:8px 16px 16px; }
  .row { padding:7px 0; }
  .rh { display:flex; align-items:center; gap:8px; margin-bottom:3px; }
  .rh .nm { font-weight:500; cursor:default; }
  .rh output { margin-left:auto; min-width:44px; text-align:right; font-family:ui-monospace,Consolas,monospace; font-size:11px; color:var(--mute); }
  .rst { padding:0 5px; height:18px; font-size:12px; line-height:1; border-radius:5px; color:var(--mute); }
  .rgbbtn { padding:0 6px; font-size:10px; border-radius:5px; color:var(--mute); height:18px; }
  .trims { display:none; margin-top:2px; } .trims.open { display:block; }
  input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:18px; background:transparent; margin:0; --c:var(--accent); }
  input[type=range]::-webkit-slider-runnable-track { height:4px; border-radius:2px; background:#2c3240; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:var(--c);
           margin-top:-5px; border:2px solid var(--panel); box-shadow:0 0 0 1px var(--c); cursor:grab; }
  input.r { --c:var(--r); } input.g { --c:var(--g); } input.b { --c:var(--b); }
  ::-webkit-scrollbar { width:8px; height:8px; } ::-webkit-scrollbar-thumb { background:#2b3140; border-radius:4px; }
  /* setup wizard */
  #wiz { position:fixed; inset:0; background:#000b; display:none; align-items:center; justify-content:center; z-index:50; }
  #wiz.open { display:flex; }
  .card { width:1040px; max-width:96vw; max-height:88vh; background:var(--panel); border:1px solid #3a4152; border-radius:14px; display:flex; flex-direction:column;
          box-shadow:0 20px 60px #000c; }
  .card h2 { margin:0; font-size:16px; } .card .top { padding:18px 22px 10px; } .card .top p { margin:4px 0 0; color:var(--mute); }
  .card .body { padding:6px 22px 14px; overflow:auto; } .card .foot { padding:14px 22px; border-top:1px solid var(--line); display:flex; gap:8px; }
  .wrow { display:flex; min-height:0; overflow:hidden; } .wrow .body { flex:1; }
  #wprev { width:380px; padding:6px 22px 14px 0; }
  #wimg { width:100%; aspect-ratio:16/9; background:#000; border-radius:8px; border:1px solid var(--line); object-fit:cover; display:block; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:4px 12px; }
  .frm { display:grid; grid-template-columns:120px 1fr; gap:8px 10px; align-items:center; margin-top:10px; }
  .frm input[type=text], .frm select { width:100%; }
  .su { display:flex; align-items:center; gap:8px; padding:7px 10px; border:1px solid var(--line); border-radius:8px; margin-top:6px; }
  .su b { font-weight:600; } .su span { color:var(--mute); font-size:12px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .su button { padding:0 7px; height:22px; }
  .inl { display:flex; gap:6px; } .inl input { flex:1; }
  .wmenu { display:none; margin-top:4px; background:var(--panel2); border:1px solid #3a4152; border-radius:10px; padding:6px; }
  .wmenu.open { display:block; }
</style>
</head>
<body>
<header>
  <span class="dot"></span><h1>Grade Sheet<span id="openname"></span></h1><span id="status">Loading</span><span class="grow"></span>
  <button id="logbtn" title="Open the Grade Sheet log (what the tool did, and any errors)">Log</button>
  <button id="setupbtn" title="Open another grade setup, or create a new one">Setups</button>
  <button id="undo" title="Undo (Ctrl+Z)">Undo</button><button id="redo" title="Redo (Ctrl+Shift+Z or Ctrl+Y)">Redo</button>
  <button id="ab" title="Drag the divider on any image: left is before, right is after">Compare before / after</button>
  <button id="recap">Recapture all</button>
  <button id="save" class="primary">Save grades</button>
</header>
<main>
  <section id="grid"></section>
  <div id="banner"><span></span><button title="Dismiss">&times;</button></div>
  <div id="busy">
    <svg viewBox="0 0 320 110" aria-hidden="true">
      <g class="smoke" fill="#8a92a6"><circle cx="80" cy="76" r="6"/><circle cx="80" cy="76" r="6"/><circle cx="80" cy="76" r="6"/></g>
      <line class="road" x1="0" y1="96" x2="320" y2="96" stroke="#3a4152" stroke-width="3" stroke-linecap="round"/>
      <g class="car" transform="translate(70 30)">
        <rect x="2" y="14" width="26" height="5" rx="2" fill="#ff8a3d"/><rect x="10" y="18" width="5" height="26" fill="#ff8a3d"/>
        <path d="M14 48 L34 34 L78 30 L96 20 L118 20 Q126 20 130 30 L170 38 L182 48 Z" fill="#ff8a3d"/>
        <path d="M98 24 L116 24 Q121 24 123 30 L94 30 Z" fill="#161920"/>
        <rect x="168" y="46" width="22" height="4" rx="2" fill="#e7e9ef"/>
        <g class="wheel"><circle cx="48" cy="52" r="14" fill="#111" stroke="#5a6274" stroke-width="2"/><path d="M48 40 V64 M36 52 H60" stroke="#8a92a6" stroke-width="2"/></g>
        <g class="wheel"><circle cx="150" cy="52" r="14" fill="#111" stroke="#5a6274" stroke-width="2"/><path d="M150 40 V64 M138 52 H162" stroke="#8a92a6" stroke-width="2"/></g>
      </g>
    </svg>
    <div id="busytxt">Preparing your views</div><div id="busysub"></div><div id="busybar"><i></i></div><button id="busystop" title="Stop capturing and give Unreal back as it was">Stop</button>
  </div>
  <aside>
    <div class="sec"><h2 id="camname">-</h2><div class="sub" id="camsub"></div>
      <div class="dd"><button id="albtn" title="Levels that are visible with this camera. Tick more here if one was missed."><span></span>&#9662;</button><div id="almenu" class="wmenu"></div></div></div>
    <div class="sec">
      <div class="btns">
        <button id="setref">Set as reference</button><button id="match">Match to reference</button>
      </div>
      <div class="btns three" style="margin-top:6px">
        <button id="copy">Copy</button><button id="paste">Paste</button><button id="reset">Reset layer</button>
      </div>
      <div class="btns" style="margin-top:6px">
        <button id="live">View in Unreal</button><button id="eject">Stop viewing</button>
      </div>
    </div>
    <div class="sec">
      <p class="lbl">Reference image</p>
      <div class="btns"><button id="refup">Upload image</button><button id="refon">Side by side</button></div>
      <input type="file" id="reffile" accept="image/*" hidden>
      <div class="hint" id="refhint"></div>
    </div>
    <div class="sec">
      <p class="lbl">Grade layer</p>
      <div class="tabs" id="tabs"></div>
      <div id="maskbox">
        <p class="lbl sp">Mask by car parts</p>
        <div class="btns three">
          <button id="pick">Pick parts</button><button id="show">Show mask</button><button id="clear">Clear</button>
        </div>
        <div class="dd"><button id="lvbtn"><span></span>&#9662;</button><div id="lvmenu"></div></div>
        <div class="hint" id="idwarn" style="color:var(--warn);display:none"></div>
        <div id="parts"></div>
        <div class="btns"><button id="maskall" class="wide">Use these parts on all cameras</button></div>
        <p class="lbl sp">Mask by drawn shapes</p>
        <div class="btns"><button id="drawbtn" title="Draw a shape with its own grade (it goes on the next free layer)">Draw a new shape</button><button id="drawadd" title="Draw another shape into this layer; it shares this layer's grade">Add to this layer</button></div>
        <div id="shapes"></div>
        <div class="hint" id="maskhint"></div>
      </div>
    </div>
    <div id="sliders"></div>
  </aside>
</main>
<div id="wiz"><div class="card">
  <div class="top"><h2 id="wtitle"></h2><p id="wsub"></p></div>
  <div class="wrow"><div class="body" id="wbody"></div>
    <div id="wprev"><p class="lbl">Live preview from Unreal</p><img id="wimg" alt=""><div class="hint" id="wcap"></div></div></div>
  <div class="foot"><button id="wcancel">Cancel</button><span class="grow"></span><button id="wback">Back</button><button id="wnext" class="primary">Next</button></div>
</div></div>

<script>
"use strict";
// name, default, master min, master max
const P = [["Blackpoint",0,-0.25,0.5],["Whitepoint",1,0.25,2],["Lift",0,-0.25,0.25],["Gain",1,0,2],
           ["Multiply",1,0,3],["Offset",0,-0.25,0.25],["Gamma",1,0.2,3],
           ["Shadows",1,0,2],["Midtones",1,0,2],["Highlights",1,0,2]];
const LAYERS = ["Whole frame","Layer A","Layer B","Layer C"];
const NL = LAYERS.length, TRIM = 0.5, PATCH = 4, MAXID = 256;
const $ = id => document.getElementById(id);
// A "setup" is one named grade of one camera (su). A camera tile shows one of its setups (cam.cur).
// tool: "none" | "pick" | "draw".  shape: index of the selected shape in cur().shapes
const S = { cams:[], setups:[], parts:[], levels:[], allCams:[], maxCams:8, sel:0, ref:0, layer:0, compare:false, refOn:false, solo:false, wipe:0.5,
            tool:"none", show:false, clip:null, shape:-1, drawing:false, drag:null, captureId:null, toastUntil:0, waitReload:false };

const defLayer = () => ({ params:Object.fromEntries(P.map(p => [p[0],[p[1],p[1],p[1]]])), mask:[] });
function normLayers(src) {
  const out = [];
  for (let k = 0; k < NL; k++) {
    const L = defLayer(), s = (src || [])[k] || {};
    for (const p of P) { const v = (s.params || {})[p[0]]; if (Array.isArray(v) && v.length === 3) L.params[p[0]] = v.map(Number); }
    L.mask = (s.mask || []).map(Number);
    out.push(L);
  }
  return out;
}
const curCam = () => S.cams[S.sel];
const suOf = cam => cam ? cam.setups[cam.cur] : null;
const cur = () => suOf(curCam());                       // the setup being edited
const camOf = su => S.cams.find(c => c.name === su.cam);
const post = (cmd) => fetch("/cmd", { method:"POST", body:JSON.stringify(cmd) }).catch(() => {});
function toast(msg) { $("status").textContent = msg; S.toastUntil = Date.now() + 2500; }
const hasShape = (su, k) => su.shapes.some(s => s.layer === k && s.closed);
const payload = su => su.layers.map((L, k) => ({ params:L.params, mask:L.mask, shape:k > 0 && hasShape(su, k) }));
// every setup that is on together with su: the camera's always-on setups whose level is active, plus su itself.
// Variant setups (paint codes) are never on together, so another variant is not included.
const chainOf = su => S.setups.filter(p => p.cam === su.cam && (p === su || (!p.variant && su.levels.includes(p.target)))).sort((a, b) => a.order - b.order);

// ---------------------------------------------------------------- grade math (same as M_NukeGrade)
function gradeCh(x, p, c) {
  let den = p.Whitepoint[c] - p.Blackpoint[c];
  if (Math.abs(den) < 1e-5) den = 1e-5;
  const a = p.Multiply[c] * (p.Gain[c] - p.Lift[c]) / den;
  const b = p.Offset[c] + p.Lift[c] - a * p.Blackpoint[c];
  return Math.pow(Math.max(a * x + b, 0), 1 / Math.max(p.Gamma[c], 1e-3));
}
// grade + tonal ranges (shadows / midtones / highlights weighted by the graded luminance, like Nuke ColorCorrect)
function gradeRGB(rgb, p) {
  const g = rgb.map((x, c) => gradeCh(x, p, c));

  if (S.tool === "draw") { cancelDraw(); syncPanel(); return refresh(); }

$("show").onclick = need(() => { S.show = !S.show; syncPanel(); refresh(); });
$("clear").onclick = need(() => { cur().layers[S.layer].mask = []; changed("Parts cleared"); });

  S.cams.forEach(c => { const o = suOf(c); o.layers[S.layer].mask = [...m]; post({ op:"set", id:o.id, layers:payload(o) }); }); noteChange();
  syncPanel(); refresh(); toast("Parts copied to all cameras"); });

$("lvbtn").onclick = e => { e.stopPropagation(); $("lvmenu").classList.toggle("open"); };
$("albtn").onclick = e => { e.stopPropagation(); $("almenu").classList.toggle("open"); };

<script>

function initForm(cam) {

}

  for (const cam of W.cams) { const o = lvlOf(cam); if (!o || cam === f.cam) continue;

}
function renderWizard() {
  const body = $("wbody"); body.innerHTML = "";
  const show = (id, on) => { $(id).style.display = on ? "" : "none"; };
  show("wprev", W.mode === "cams" || W.mode === "cam"); show("wback", W.mode !== "list"); show("wcancel", W.mode !== "list" || !!S.open);
  $("wcancel").textContent = W.mode === "list" ? "Close" : "Cancel";
  if (W.mode === "list") {

      open.onclick = () => openSetup(name); edit.onclick = () => startEdit(name); x.title = "Delete this setup";
      x.onclick = () => { if (x.dataset.armed !== "1") { x.dataset.armed = "1"; x.textContent = "Delete?"; x.title = "Click again to delete " + name + " from " + mine.length + " camera level(s)";
          return setTimeout(() => { x.dataset.armed = ""; x.textContent = "×"; }, 3000); }

  } else if (W.mode === "name") {

        for (const v of vs.variants) { const o = el("option", "", v); o.value = v; o.selected = W.variants[vs.name] === v; sel.appendChild(o); }
        sel.onchange = () => { const auto = !W.name.trim() || W.name === Object.values(W.variants).join("_");
          if (sel.value) W.variants[vs.name] = sel.value; else delete W.variants[vs.name];
          if (auto) W.name = Object.values(W.variants).join("_"); renderWizard(); };
        frm.append(el("span", "", vs.name), sel); }
      body.appendChild(el("div", "hint", Object.keys(W.variants).length
        ? "This grade is only on with " + Object.entries(W.variants).map(([k, v]) => k + " = " + v).join(" and ") + ". The car is switched to it for the capture."
        : "Nothing picked from the variant tables: this grade is always on (an overall grade)."));
    } else {

// live preview: Unreal looks through the camera with only the ticked levels visible, and sends back a picture

// ---------------------------------------------------------------- start + polling
async function getJSON(url) { try { const r = await fetch(url + "?t=" + Date.now()); return r.ok ? await r.json() : null; } catch (e) { return null; } }

  $("busybar").firstChild.style.width = "0%"; $("status").textContent = "Disconnected";

async function poll() {

      return { name:n, setups:mine, cur:mine.findIndex(s => s.name === S.open) }; }).filter(c => c.cur >= 0) : [];
